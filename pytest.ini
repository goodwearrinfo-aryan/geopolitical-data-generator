[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    streaming: Tests requiring Kafka/Neo4j (mocked)
    slow: Slow running tests

# Options
addopts = 
    --strict-markers
    --strict-config
    -ra
    --tb=short