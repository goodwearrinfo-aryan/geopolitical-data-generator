services:
  redis:
    image: valkey/valkey:8-alpine
    volumes: [redis:/data]
    deploy: { resources: { limits: { memory: 512M } } }

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/1
    deploy: { resources: { limits: { cpus: '1.5', memory: 2G } } }

  worker-scenarios:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    command: celery -A celery_app worker -Q scenarios -c 2 --prefetch-multiplier=1
    environment: { REDIS_URL: redis://redis:6379/0, RESULT_BACKEND: redis://redis:6379/1 }
    deploy: { resources: { limits: { cpus: '1', memory: 1G } } }

  worker-exports:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    command: celery -A celery_app worker -Q exports -c 4 --prefetch-multiplier=1
    environment: { REDIS_URL: redis://redis:6379/0, RESULT_BACKEND: redis://redis:6379/1 }
    deploy: { resources: { limits: { cpus: '2', memory: 2G } } }

  worker-calibration:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    command: celery -A celery_app worker -Q calibration -c 1 --prefetch-multiplier=1
    environment: { REDIS_URL: redis://redis:6379/0, RESULT_BACKEND: redis://redis:6379/1 }
    deploy: { resources: { limits: { cpus: '2', memory: 4G } } }

  flower:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    command: celery -A celery_app flower --port=5555
    ports: ["5555:5555"]
    environment: { REDIS_URL: redis://redis:6379/0 }

  prometheus:
    image: prom/prometheus:latest
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml, prom:/prometheus]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    volumes: [grafana:/var/lib/grafana, ./dashboards:/etc/grafana/provisioning/dashboards]
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}

volumes: { redis:, prom:, grafana: }
