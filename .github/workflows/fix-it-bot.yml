name: Fix-It-Bot

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily – shift as needed
  workflow_dispatch:

jobs:
  check-nightly-run:
    runs-on: ubuntu-latest
    outputs:
      ruff_errors_path: ${{ steps.dump_artifacts.outputs.ruff_errors_path }}
      pytest_results_path: ${{ steps.dump_artifacts.outputs.pytest_results_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install deps (ruff, pytest, mypy)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy

      - name: Run the nightly health‑check
        id: run-nightly
        run: |
          ruff check . > ruff-errors.txt 2>&1 || true
          python -m pytest tests/ -q --junitxml=pytest-results.xml
          echo "ruff_errors_path=ruff-errors.txt" >> ${{ outputs.ruff_errors_path }}
          echo "pytest_results_path=pytest-results.xml" >> ${{ outputs.pytest_results_path }}

  auto-fix-and-pr:
    needs: check-nightly-run
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download nightly artefacts
        uses: actions/download-artifact@v4
        with:
          name: nightly-artifacts
          path: ./artifacts

      - name: Set up Python (fix‑script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install fix‑script deps
        run: python -m pip install --upgrade pip

      - name: Run the auto‑fix script
        env:
          RUFF_ERRORS: ./artifacts/ruff-errors.txt
          PYTEST_RESULTS: ./artifacts/pytest-results.xml
        run: python .github/workflows/fix_script.py

      - name: Commit & push fixes
        run: |
          git config user.name "fix-it-bot"
          git config user.email "fix-it-bot@users.noreply.github.com"
          git checkout -b "fix-it-bot/$(date +%Y%m%d-%H%M%S)"
          git add .
          git commit -m "chore: auto‑fix nightly‑run issues [bot]"
          git push origin "fix-it-bot/$(date +%Y%m%d-%H%M%S)"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: auto‑fix nightly‑run issues (bot)"
          body: |
            This PR was generated by the **Fix‑It‑Bot** nightly run.

            ### What was fixed
            - (list of changes the script performed – see the commit message and the diff)

            ### How to review
            - Look at the commit diffs.
            - Run `ruff check .` and `pytest` locally to confirm the errors are gone.
            - If everything looks good, merge the PR (or request a reviewer).

          # Optional: auto‑merge if you set a protect‑branch rule that allows auto‑merge.
          # add-label: "bot‑auto‑merge"
          # assignees: ""
          # reviewers: ""

      - name: Add comment linking to artefacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const artifactLink = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
              body: `🛠️ **Fix‑It‑Bot** PR created: <${artifactLink}|View run> • Please review the changes before merging.`
            });