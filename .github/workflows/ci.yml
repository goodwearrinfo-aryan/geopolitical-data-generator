name: CI
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e .[ray,sqlalchemy,plotly] ruff mypy pytest pytest-benchmark bandit
      - run: ruff check .
      - run: mypy --strict api/ engine/ tasks/ calibration/
      - run: bandit -r engine/ tasks/ --fail-on-medium
      - run: pytest tests/ -v --tb=short
      - run: pytest benchmarks/ --benchmark-only
